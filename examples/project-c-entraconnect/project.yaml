    - {domain: "sync.idp-sample.example", purpose: "同步服务端点（示例）", via_proxy: "是"}
    - {domain: "crl.idp-sample.example", purpose: "证书吊销确认（示例）", via_proxy: "是"}
  dc_connectivity: "云主机经站点间专线访问本地 3 台域控，目录服务端口按官方端口清单放通"
  proxy: "客户强制使用出站代理，同步服务器需配置代理参数并在代理侧放行出站清单"

