    - {item: "已停支操作系统终端的准确台数", impact: "影响覆盖率分母与 R-03 处置方案"}

targets:
  scope: "覆盖 12 拠点 2400 台 Windows 终端的统一客户端管理，实现补丁、软件分发与资产可视化"
  out_of_scope:
    - "非 Windows 终端（macOS / 移动端）"
    - "服务器群的管理"
    - "应用打包（由客户应用团队负责）"
  success_criteria:
    - "客户端覆盖率 ≥95%（按拠点验收）"
    - "补丁合规率 ≥90%（关键补丁 30 日内）"
    - "资产信息与资产管理系统差异 ≤2%"

schedule:
  start: "2028-04-01"
  go_live: "2028-10-15"
  milestones:
    - {name: "要件定義完了", date: "2028-05-15", approval: true, kind: "normal"}
    - {name: "基本設計完了", date: "2028-07-10", approval: true, kind: "normal"}
    - {name: "试点拠点铺装完了", date: "2028-08-25", approval: true, kind: "mass_change"}
    - {name: "全拠点铺装完了", date: "2028-10-10", approval: true, kind: "mass_change"}

rollout:
  - {id: "W-01", name: "试点", scope: "福冈拠点", count: 300, start: "2028-08-17", end: "2028-08-24", business_impact: "工作日 18 时后推送，每台重启一次", exit_criteria: "覆盖率与上报率均 ≥95%，用户问询 ≤10 件"}
  - {id: "W-02", name: "关西", scope: "大阪及关西其他拠点", count: 750, start: "2028-09-04", end: "2028-09-15", business_impact: "工作日 18 时后推送，避开月末结算日", exit_criteria: "覆盖率与上报率均 ≥95%，无未关闭的一级问询"}
  - {id: "W-03", name: "关东", scope: "东京及关东其他拠点", count: 1350, start: "2028-09-25", end: "2028-10-06", business_impact: "分两批推送，每批不超过 700 台", exit_criteria: "覆盖率与上报率均 ≥95%，补丁试部署成功率 ≥98%"}

comparison:
  client_profile: "conservative"
  options:
    - {name: "一次性全量推送", scores: {cost: 4, risk: 1, duration: 5, impact: 1, scalability: 2}}
    - {name: "分批试点推进", scores: {cost: 3, risk: 5, duration: 3, impact: 4, scalability: 4}}
    - {name: "混合加入并行（Intune 协同）", scores: {cost: 2, risk: 3, duration: 2, impact: 3, scalability: 5}}
  chosen: "分批试点推进"
  rejected_reasons:
    "一次性全量推送": "2400 台终端同时变更，任一缺陷即造成全社业务中断，与客户『终端不得影响明日上班』的硬性要求冲突；回退窗口几乎不存在。"
    "混合加入并行（Intune 协同）": "客户现有 Intune 仅覆盖部分设备且策略未与配置管理器对齐，并行期双管理通道会产生策略冲突，需额外 3 个月整合，超出本财年预算期。"
  sensitivity_note: "若『工期』权重上调至 0.30 以上，一次性推送的总分将反超，但『业务影响』评分仍为 1 分，属不可接受区间，故结论不翻转。"

risks:
  - {id: "R-01", category: "技术", description: "客户端安装成功但不上报，资产为空", trigger: "边界组未启用站点分配或站点系统未在 DNS 发布", impact: "资产可视化目标无法达成", likelihood: "高", mitigation: "铺装前执行 G-A-01 全覆盖差集检查；试点拠点先行验证上报率", owner: "基础设施工程师", related_task: "A-04-01", status: "未处理"}
  - {id: "R-02", category: "组织", description: "部分拠点业务部门拒绝在业务日变更", trigger: "波次排期落入月末结算期", impact: "铺装延期 2-4 周", likelihood: "中", mitigation: "排期前与各拠点主管个别确认；提供两套窗口候选", owner: "项目经理", related_task: "A-03-01", status: "未处理"}
  - {id: "R-03", category: "技术", description: "老旧终端不支持当前客户端", trigger: "存在已停支操作系统的设备", impact: "覆盖率目标无法达成", likelihood: "中", mitigation: "现状盘点阶段列出停支设备清单并单独制定处置方案", owner: "基础设施工程师", related_task: "A-02-01", status: "未处理"}
  - {id: "R-04", category: "技术", description: "集合规则误判导致误推", trigger: "设备集合与用户集合混用", impact: "非目标设备被变更", likelihood: "中", mitigation: "导出集合成员与预期比对后再批准部署", owner: "基础设施工程师", related_task: "A-04-02", status: "未处理"}
  - {id: "R-05", category: "管理", description: "铺装后运维承接不清，问题积压", trigger: "移交范围未明确", impact: "上线后投诉集中", likelihood: "中", mitigation: "第 11 章明确移交物与承接团队；上线后 4 周设过渡期", owner: "项目经理", related_task: "A-06-01", status: "未处理"}

steps:
  - id: "A-02-01"
    phase: "现状评估"
    name: "终端与拠点现状盘点"
    preconditions:
      - "客户已提供终端清单导出权限"
      - "拠点网络图已取得"
    action: "运行 powershell/sccm 目录下盘点脚本，导出终端数与操作系统分布"
    expected: "生成 CSV，含终端总数、拠点分布、操作系统版本分布"
    verify: "CSV 终端总数与资产管理系统差异 ≤5%"
    on_fail: "F-018"
    rollback: "无需回退，重新执行盘点并核对数据源"
    minutes: 120
    owner_role: "基础设施工程师"
  - id: "A-03-01"
    phase: "设计"
    name: "波次划分与拠点排期"
    preconditions:
      - "现状盘点 CSV 已完成"
      - "各拠点业务日历已取得"
    action: "按拠点终端数与业务敏感度划分 3 波，避开冻结窗口"
    expected: "波次表含拠点、终端数、时间窗、退出条件"
    verify: "calendar_check.py 无 R1/R2/R3 阻断"
    on_fail: "F-021"
    rollback: "调整波次划分后重新校验，不影响既有环境"
    minutes: 240
    owner_role: "项目经理"
  - id: "A-04-01"
    phase: "实施"
    name: "客户端铺装前 Gate 检查"
    preconditions:
      - "站点系统已部署"
      - "边界与边界组已配置"
    action: "执行 G-A-01 全部七项检查并留存证据 CSV"
    expected: "七项全部通过，证据 CSV 归档至 evidence/"
    verify: "逐项核对证据文件存在且结论为通过"
    on_fail: "F-012"
    rollback: "停止后续波次，修复未通过项后重新检查"
    minutes: 180
    owner_role: "基础设施工程师"
  - id: "A-04-02"
    phase: "实施"
    name: "试点拠点铺装"
    preconditions:
      - "G-A-01 通过"
      - "试点拠点用户告知已发出"
    action: "按波次表向试点拠点推送客户端"
    expected: "试点拠点覆盖率 ≥95%，上报率 ≥95%"
    verify: "控制台按拠点统计覆盖率与上报率"
    on_fail: "F-013"
    rollback: "卸载试点拠点客户端，恢复至铺装前状态，暂停后续波次"
    minutes: 480
    owner_role: "基础设施工程师"
  - id: "A-06-01"
    phase: "移交"
    name: "运维移交"
    preconditions:
      - "全拠点铺装完成且验收矩阵通过"
    action: "交付运维手册、告警配置、联络路径，执行交接会议"
    expected: "承接团队签署交接确认"
    verify: "交接确认书归档"
    on_fail: "F-030"
    rollback: "延长过渡期，我方继续代管"
    minutes: 240
    owner_role: "项目经理"

gates:
  - id: "G-A-01"
    name: "客户端铺装前检查"
    checks:
      - "管理共享可访问"
      - "目录服务所需 RPC 与共享通道已放通"
      - "边界组覆盖目标全部网段"
      - "站点系统已在 DNS 正确发布"
      - "推送账号在目标机具备本地管理员权限"
      - "集合成员规则已复核（含排除项）"
      - "试点拠点验证报告已出具"
    fail_action: "停止铺装，修复未通过项并重新检查，不得带缺陷推进"

acceptance:
  - {id: "T-01", requirement: "客户端覆盖率 ≥95%", content: "按拠点统计客户端安装覆盖率", method: "控制台报表导出 + 抽样现场确认", criteria: "每个拠点覆盖率均 ≥95%", evidence: "控制台报表 CSV + 抽样记录", client_confirmer: "客户信息系统部 担当", result: ""}
  - {id: "T-02", requirement: "补丁合规率 ≥90%", content: "关键补丁 30 日内合规率", method: "合规报表导出", criteria: "关键补丁合规率 ≥90%", evidence: "合规报表 CSV", client_confirmer: "客户信息系统部 担当", result: ""}
  - {id: "T-03", requirement: "资产差异 ≤2%", content: "与资产管理系统比对", method: "两系统清单差集", criteria: "差异率 ≤2%", evidence: "差集报告", client_confirmer: "客户资产管理部门", result: ""}

impact:
  matrix:
    - {unit: "福冈拠点", department: "全部门", count: 300, change: "安装客户端并重启一次", downtime_minutes: 10, wave: "W-01"}
    - {unit: "大阪及关西其他拠点", department: "全部门（结算日除外）", count: 750, change: "安装客户端并重启一次", downtime_minutes: 10, wave: "W-02"}
    - {unit: "东京及关东其他拠点", department: "全部门（分两批）", count: 1350, change: "安装客户端并重启一次", downtime_minutes: 10, wave: "W-03"}
  user_visible_changes:
    - {item: "登录方式", changed: "否", detail: "登录名与密码不变。"}
    - {item: "重启", changed: "是", detail: "铺装当晚需重启一次，下班前保存文件。"}
  user_actions:
    - "铺装当日下班前保存文件并保持终端开机、接入公司网络"
    - "次日开机后若出现软件中心图标以外的异常提示，联系拠点现场组长"
  user_no_actions:
    - "不需要自行安装或卸载任何软件"
    - "不需要更改密码或重新登录业务系统"
  downtime_basis: "依据试点前的验证环境实测：客户端安装约 5 分钟，重启约 3 分钟，合计按 10 分钟计；推送在 18 时后执行，业务时间内中断为 0 分钟。实测值在试点完成后回填修订。"

cutover:
  t_definition: "各波次首日推送开始时刻（18:00）"
  checkpoints:
    - {t_plus_minutes: 60, expected_state: "首批 50 台客户端安装成功且已在控制台上报", on_miss: "暂停本波次后续推送，按 F-012 / F-013 排查"}
    - {t_plus_minutes: 240, expected_state: "本日目标终端安装成功率 ≥95%", on_miss: "启动「停止后续波次」回退，次日 9 时前提交经过报告"}
  decision_role: "项目经理（与客户信息系统部课长共同判定）"
  rollback_levels:
    - {name: "停止后续波次", trigger: "任一检查点未达成，或一级问询单日超过 10 件", deadline: "T+240 分钟", steps: ["停止本波次剩余推送任务", "冻结后续波次的部署计划", "通知拠点现场组长与客户窗口"], minutes: 30, end_state: "已铺装终端保持现状，后续波次暂停"}
    - {name: "客户端卸载", trigger: "已铺装终端出现业务应用异常且原因指向客户端", deadline: "发现后 24 小时内由客户窗口确认", steps: ["对受影响集合下发卸载任务", "按拠点抽样确认卸载完成与业务应用恢复", "更新资产与覆盖率报表"], minutes: 120, end_state: "受影响终端恢复至铺装前状态"}

escalation:
  - {level: "一级", condition: "单台终端异常或用户问询", contact_role: "现场组长", within: "受理后 2 小时内答复"}
  - {level: "二级", condition: "同一拠点 10 台以上异常", contact_role: "构建负责人", within: "30 分钟内首报"}
  - {level: "三级", condition: "检查点未达成或业务应用受影响", contact_role: "项目经理 → 客户信息系统部课长", within: "15 分钟内首报"}

pilot:
  target: "福冈拠点（300 台）"
  reason: "终端数适中，拠点内同时存在生产与事务两类部门，且广域网带宽为全社最低档，能暴露内容分发问题"
  representativeness: "操作系统分布与全社比例接近；包含共享终端与老旧终端两类高风险设备"
  success_criteria:
    - "覆盖率 ≥95%，上报率 ≥95%"
    - "业务时间内中断 0 分钟"
    - "一级问询 ≤10 件且全部在 2 小时内答复"
  on_fail: "不进入第二波；按失败模式库定位原因，修正后在同一拠点复测，复测通过后重新提交承认"

phases:
  - {name: "要件定义", goal: "确定范围、波次原则与验收基准", gate: "要件定義完了承认", exit_criteria: "要件定义书获客户承认"}
  - {name: "基本设计与构建", goal: "完成站点系统、边界组与集合设计并构建", gate: "G-A-01", exit_criteria: "G-A-01 七项全部通过"}
  - {name: "试点铺装", goal: "在试点拠点验证上报率与业务影响", gate: "试点成功判定", exit_criteria: "试点成功标准全部达成"}
  - {name: "全拠点铺装与移交", goal: "完成剩余波次并移交运维", gate: "验收矩阵", exit_criteria: "T-01 至 T-03 全部通过"}

pre_communication:
  - {date: "2026-10-20", department: "客户信息系统部", person_role: "部长", content: "分批试点推进方针与波次原则", conclusion: "同意，要求试点拠点的成功标准量化", follow_up: "已在 5.3 节写入量化标准"}
  - {date: "2026-10-27", department: "客户关西业务部", person_role: "业务主管", content: "关西波次时间窗与月末结算日的关系", conclusion: "有条件同意：结算日前后三天不变更", follow_up: "W-02 排期已避开，下次周会确认"}

open_items:
