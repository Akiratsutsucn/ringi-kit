  budget_period: "2028年度上半期预算（4月执行开始）"
  approval_buffer_days: 10
  approval_nodes: ["内部评审", "客户评审", "再承认"]
  freeze_windows:
    - {name: "年末年始", start: "2027-12-29", end: "2028-01-03"}
    - {name: "お盆", start: "2028-08-13", end: "2028-08-16"}
    - {name: "期末棚卸", start: "2028-03-25", end: "2028-03-31"}
  fiscal_boundary_months: [3, 9]
  security_review: "optional"
  consumer_side_check_sheet: false
  multi_tier_vendors: true
  vendor_tiers: 3
  decision_path:
