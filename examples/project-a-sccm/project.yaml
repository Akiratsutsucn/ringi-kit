  - {content: "各拠点广域网可用带宽实测值", owner: "构建负责人", due: "基本設計完了前", chapter: "3、6"}
  - {content: "已停支操作系统终端台数", owner: "客户信息系统部 担当", due: "要件定義完了前", chapter: "2、8"}

revision_history:
  - {version: "V1.0", date: "2026-11-10", change: "初版", author: "自社 项目经理", approver: "自社 事业部长"}

deliverables:
  items: ["proposal", "approval_summary", "runbook", "wbs", "risk", "test_matrix", "qa", "meeting_minutes", "diagrams"]
  language: "zh"
  format: "Markdown 源文件 + CSV；定稿另行转换为 PDF"

anchors:
