    - {tier: 2, name: "一次承包方（代号 P1）", role: "构建与铺装执行", scope: "站点系统构建、客户端推送、证据 CSV 采集", not_doing: "不直接与客户业务部门联络", contact_role: "构建负责人"}
    - {tier: 3, name: "现场作业方（代号 P2）", role: "拠点现场支援", scope: "拠点现场终端确认、用户问询一次受理", not_doing: "不变更站点与集合配置", contact_role: "现场组长"}

current_state:
  domains:
    - {name: "corp.a-example.jp", forest: "corp", dc_count: 4, functional_level: "【待确认】"}
  cloud_tenants:
    - {name: "atenant", user_count: 2200, sync_method: "password_hash"}
  endpoints:
    total: 2400
    by_site: {东京: 1200, 大阪: 600, 福冈: 300, 其他: 300}
  existing_tools: ["WSUS", "Intune（部分设备）", "资产管理系统"]
  pain_points:
    - {point: "补丁由 WSUS 与 Intune 分别分发，关键补丁合规状态没有统一报表", evidence: "【示例】现状访谈：月度合规报表需人工汇总两套系统，约 3 人日"}
    - {point: "资产管理系统与实际终端不一致", evidence: "【示例】抽样 200 台中 14 台台账信息过期（7%）"}
    - {point: "软件分发依赖拠点担当手工安装", evidence: "【示例】上一财年拠点手工安装工单约 380 件"}
  unquantified:
