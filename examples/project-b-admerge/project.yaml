  - {id: "W-03", name: "B2 全体", scope: "B2 用户与计算机", count: 1400, start: "2028-11-14", end: "2028-12-01", business_impact: "按拠点分 6 晚迁移，邮箱切换随批次执行", exit_criteria: "迁移完成率 ≥99.5%，邮箱与目录账户一致"}

comparison:
  client_profile: "conservative"
  options:
    - {name: "同林内重组", scores: {cost: 5, risk: 1, duration: 4, impact: 2, scalability: 3}}
    - {name: "跨林迁移（含历史 SID 迁移）", scores: {cost: 2, risk: 3, duration: 2, impact: 3, scalability: 5}}
    - {name: "资源林 + 林间信任", scores: {cost: 3, risk: 4, duration: 3, impact: 4, scalability: 2}}
  chosen: "跨林迁移（含历史 SID 迁移）"
  rejected_reasons:
    "同林内重组": "B1/B2/B3 为三个独立林，同林内重组在技术上不适用；若强行新建统一林，等价于跨林迁移但需重建全部对象，风险更高。"
    "资源林 + 林间信任": "三林长期并存意味着三套域控、三套组策略、三套运维人员，五年 TCO 高于迁移；且客户明确要求『统一登录名』，信任关系无法满足该要求。"
  sensitivity_note: "若『成本』权重上调至 0.35 以上，资源林方案总分可能反超，但该方案无法满足客户已书面确认的『统一登录名』硬性要求，故结论不翻转。"

risks:
  - {id: "R-01", category: "技术", description: "用户可登录但访问旧资源被拒", trigger: "历史 SID 未迁移或账户映射错误", impact: "业务中断投诉", likelihood: "高", mitigation: "映射表逐条回查；切换前抽样 200 名验证资源访问", owner: "目录服务工程师", related_task: "B-04-02", status: "未处理"}
  - {id: "R-02", category: "技术", description: "历史 SID 到期后权限静默失效", trigger: "回收日到达但依赖应用未改造", impact: "旧系统不可用且难以定位", likelihood: "高", mitigation: "方案中确定回收日与前置条件；建立依赖应用清单并逐项跟踪改造", owner: "目录服务工程师", related_task: "B-05-03", status: "未处理"}
  - {id: "R-03", category: "战略", description: "客户误认为域合并等于云租户合并", trigger: "方案未在第一章声明云侧仍为多租户", impact: "验收阶段争议，项目被要求追加范围", likelihood: "高", mitigation: "第 1 章设专节声明（≥200 字），并在稟議用摘要中重复", owner: "项目经理", related_task: "B-01-02", status: "未处理"}
  - {id: "R-04", category: "组织", description: "各社账号命名规则无法统一", trigger: "存在同名同姓或命名习惯冲突", impact: "迁移延期", likelihood: "中", mitigation: "要件定义阶段确定命名规则与例外受理流程", owner: "项目经理", related_task: "B-03-01", status: "未处理"}
  - {id: "R-05", category: "技术", description: "计算机账户迁移后组策略失效", trigger: "OU 结构与 GPO 链接未同步设计", impact: "终端策略异常", likelihood: "中", mitigation: "迁移前完成 OU 与 GPO 映射设计；试点验证策略应用结果", owner: "目录服务工程师", related_task: "B-04-03", status: "未处理"}
  - {id: "R-06", category: "技术", description: "移行工具支持状态变化导致中途停摆", trigger: "工具官方支持终止", impact: "迁移无法继续", likelihood: "低", mitigation: "AN-04 锚点每次生成时核实；准备替代路径", owner: "架构师", related_task: "B-02-01", status: "未处理"}

steps:
  - id: "B-01-02"
    phase: "前提与制约"
    name: "云侧身份状态声明编制"
    preconditions:
      - "各社租户清单与同步方式已取得"
    action: "编制云侧身份现状与合并后状态说明，列明可选路径"
    expected: "≥200 字说明，含租户数量、同步方式、合并后仍为多租户的事实、后续可选路径"
    verify: "客户技术负责人书面确认已知悉"
    on_fail: "F-031"
    rollback: "无技术回退，补充说明后重新提交"
    minutes: 180
    owner_role: "项目经理"
  - id: "B-02-01"
    phase: "设计"
    name: "移行工具支持状态核实"
    preconditions:
      - "AN-04 锚点已建"
    action: "按锚点提示访问官方文档，核实工具支持状态与版本要求"
    expected: "锚点 value 已填，verified_on 为当日"
    verify: "lint.py L-13 通过"
    on_fail: "F-032"
    rollback: "不适用（只读核实）"
    minutes: 60
    owner_role: "架构师"
  - id: "B-03-01"
    phase: "设计"
    name: "账号命名规则与例外流程确定"
    preconditions:
      - "三社账号清单已导出"
    action: "编制命名规则、冲突处理规则、例外受理流程，提交客户评审"
    expected: "规则文档获客户承认"
    verify: "承认记录归档"
    on_fail: "F-033"
    rollback: "规则未获承认前不进入迁移实施"
    minutes: 480
    owner_role: "项目经理"
  - id: "B-04-02"
    phase: "实施"
    name: "切换前 Gate 检查与抽样验证"
    preconditions:
      - "G-B-01 全部检查项已准备证据"
    action: "执行七项检查，抽样 200 名用户验证资源访问"
    expected: "七项通过，抽样成功率 ≥99%"
    verify: "证据 CSV 与抽样记录归档"
    on_fail: "F-040"
    rollback: "暂停切换，修复后重新检查"
    minutes: 300
    owner_role: "目录服务工程师"
  - id: "B-04-03"
    phase: "实施"
    name: "计算机账户迁移与策略验证"
    preconditions:
      - "OU 与 GPO 映射设计已完成"
    action: "迁移计算机账户并在试点终端验证策略应用"
    expected: "试点终端策略正常，无异常事件"
    verify: "事件日志核对 + 策略结果集导出"
    on_fail: "F-041"
    rollback: "将计算机账户回滚至源林并恢复原 GPO 链接"
    minutes: 360
    owner_role: "目录服务工程师"
  - id: "B-05-03"
    phase: "收尾"
    name: "历史 SID 回收计划编制"
    preconditions:
      - "依赖旧 SID 应用清单已完成"
    action: "确定回收日、前置条件、清理后验证方法与责任人"
    expected: "文档含具体日期、前置条件清单、验证步骤"
    verify: "客户承认回收计划"
    on_fail: "F-042"
    rollback: "延长回收日并追加改造资源"
    minutes: 240
    owner_role: "架构师"

gates:
  - id: "G-B-01"
    name: "域合并切换前检查"
    checks:
      - "账户映射表逐条可追溯"
      - "历史 SID 存活期限与回收日已书面确定"
      - "依赖旧 SID 的应用清单及改造计划已确认"
      - "跨林权限重写完成"
      - "回退时间点精确到分钟"
      - "云侧租户数量与合并后状态已向客户书面说明"
      - "移行工具官方支持状态已核实"
    fail_action: "暂停切换，逐项补齐后重新检查"

acceptance:
  - {id: "T-01", requirement: "对象迁移完成率 ≥99.5%", content: "统计源林对象迁移结果", method: "源/目标清单差集", criteria: "完成率 ≥99.5%，未完成项逐项列明理由", evidence: "差集报告 CSV", client_confirmer: "客户信息系统部 部长", result: ""}
  - {id: "T-02", requirement: "抽样用户资源访问正常", content: "200 名抽样用户访问旧资源", method: "脚本验证 + 用户确认", criteria: "成功率 ≥99%", evidence: "抽样记录 + 用户确认书", client_confirmer: "客户业务部门 担当", result: ""}
  - {id: "T-03", requirement: "登录名统一规则适用", content: "核对全部用户登录名", method: "规则比对脚本", criteria: "100% 适用，例外有书面批准", evidence: "规则比对报告 + 例外批准书", client_confirmer: "客户信息系统部 担当", result: ""}

impact:
  matrix:
    - {unit: "B3 试点部门", department: "信息系统部门", count: 150, change: "账号迁入 B1 林，登录名变更", downtime_minutes: 180, wave: "W-01"}
    - {unit: "B3 各拠点", department: "全部门", count: 450, change: "账号与计算机迁入 B1 林", downtime_minutes: 180, wave: "W-02"}
    - {unit: "B2 各拠点", department: "全部门", count: 1400, change: "账号、计算机与邮箱迁入 B1 林", downtime_minutes: 240, wave: "W-03"}
  user_visible_changes:
    - {item: "登录名", changed: "是", detail: "改为集团统一规则的登录名，迁移前一周邮件通知新登录名。"}
    - {item: "密码", changed: "否", detail: "沿用原密码，首次登录后按集团策略在 90 日内变更。"}
    - {item: "重新登录", changed: "是", detail: "迁移次日首次开机需用新登录名登录一次。"}
    - {item: "邮件客户端", changed: "是", detail: "B2 用户的邮件客户端在首次启动时自动重新配置，需等待约 5 分钟。"}
    - {item: "共享文件夹", changed: "否", detail: "访问路径不变，权限经历史 SID 维持，回收日前完成权限重写。"}
    - {item: "打印机", changed: "否", detail: "由登录脚本重新映射，用户无需操作。"}
    - {item: "桌面与个人设置", changed: "否", detail: "配置文件随迁移转换，桌面与文档保持原样。"}
  user_actions:
    - "迁移前一日下班前保存文件并注销"
    - "迁移次日用新登录名登录，原密码不变"
    - "发现共享文件夹或打印机无法使用时联系拠点现场组长"
  user_no_actions:
    - "不需要重新设置桌面、收藏夹与个人文档"
    - "不需要手工添加打印机或共享文件夹"
  downtime_basis: "依据试点迁移的计划值：每批迁移在 20 时至 23 时执行，期间该批账号停用约 3 小时；B2 批次含邮箱切换，按 4 小时计。业务时间内中断为 0 分钟，试点后以实测值修订。"

cutover:
  t_definition: "每批迁移当晚 20:00 开始停用源账号的时刻"
  checkpoints:
    - {t_plus_minutes: 60, expected_state: "当批账号与计算机对象迁移完成率 ≥99%", on_miss: "停止当批剩余迁移，启动单批回退"}
    - {t_plus_minutes: 120, expected_state: "抽样 20 名用户以新登录名登录成功并可访问原共享资源", on_miss: "启动单批回退，源账号恢复启用"}
    - {t_plus_minutes: 180, expected_state: "当批全部检查项通过，源账号保持停用", on_miss: "启动单批回退，次日 9 时前提交经过报告"}
  decision_role: "项目经理（与 B集团信息系统统括部课长共同判定）"
  rollback_levels:
    - {name: "单批回退", trigger: "当批任一检查点未达成", deadline: "T+180 分钟", steps: ["停止当批迁移任务", "重新启用当批源账号与源计算机账户", "在目标林停用当批已迁移对象", "抽样确认用户以原登录名登录与资源访问恢复"], minutes: 90, end_state: "当批用户以原登录名在源林登录，资源访问与迁移前一致"}
    - {name: "全面停止", trigger: "连续两批回退，或发现映射表系统性错误", deadline: "第二次回退判定后 24 小时内", steps: ["冻结全部后续批次", "保持已完成批次在目标林的状态", "召开三社临时评审会确认原因与重排方针"], minutes: 60, end_state: "已完成批次维持现状，后续批次暂停至重新承认"}

escalation:
  - {level: "一级", condition: "个别用户登录或资源访问问询", contact_role: "现场组长", within: "受理后 1 小时内答复"}
  - {level: "二级", condition: "同一批次 10 名以上用户异常", contact_role: "迁移负责人", within: "30 分钟内首报"}
  - {level: "三级", condition: "检查点未达成或回退判定", contact_role: "项目经理 → B集团信息系统统括部课长", within: "15 分钟内首报"}

pilot:
  target: "B3 信息系统部门及一个拠点（150 名）"
  reason: "B3 林规模最小、回退影响最小；信息系统部门用户能准确描述异常，便于定位"
  representativeness: "包含共享文件夹、打印机、本地配置文件三类依赖，覆盖迁移中最常见的失败模式"
  success_criteria:
    - "抽样资源访问成功率 ≥99%"
    - "组策略应用结果与设计一致"
    - "回退演练一次并在 90 分钟内完成"
